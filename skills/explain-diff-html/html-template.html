<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FILL: change title, e.g. PR 1234 explanation</title>
    <style>
      :root {
        --bg: #ffffff;
        --surface: #f6f7f9;
        --text: #1c2024;
        --muted: #60646c;
        --border: #d7dbdf;
        --border-strong: #848c95;
        --accent: #2f5ee0;
        --accent-soft: #e8eefc;
        --edge: #a35608;
        --edge-soft: #fbefe1;
        --ok: #1a7f47;
        --ok-soft: #e4f3ea;
        --bad: #c62a3b;
        --bad-soft: #fbe7e9;
        --measure: 68ch;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16181b;
          --surface: #1f2226;
          --text: #eceef0;
          --muted: #9ba1a6;
          --border: #33383d;
          --border-strong: #646c75;
          --accent: #7aa2ff;
          --accent-soft: #1e2740;
          --edge: #e08c3a;
          --edge-soft: #2e2517;
          --ok: #57c98b;
          --ok-soft: #17281d;
          --bad: #f07178;
          --bad-soft: #2c1a1c;
        }
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          17px/1.65 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      a {
        color: var(--accent);
      }
      a:visited {
        color: var(--accent);
      }
      .layout {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 2.5rem;
        max-width: 1080px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 6rem;
      }
      nav.toc {
        position: sticky;
        top: 2.5rem;
        align-self: start;
        font-size: 0.9rem;
      }
      nav.toc strong {
        display: block;
        font-size: 0.72rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.6rem;
      }
      nav.toc ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      nav.toc li {
        margin: 0.35rem 0;
      }
      nav.toc a {
        color: var(--muted);
        text-decoration: none;
      }
      nav.toc a:hover {
        color: var(--accent);
      }
      main {
        min-width: 0;
      }
      main > header {
        border-bottom: 1px solid var(--border);
        padding-bottom: 1.25rem;
        margin-bottom: 2rem;
      }
      main > header h1 {
        font-size: 1.9rem;
        line-height: 1.2;
        margin: 0 0 0.6rem;
      }
      main > header .lead {
        color: var(--muted);
        margin: 0;
        max-width: var(--measure);
      }
      main > header .provenance {
        color: var(--muted);
        font-family: ui-monospace, monospace;
        font-size: 0.76rem;
        margin: 0.7rem 0 0;
      }
      .colophon {
        grid-column: 1 / -1;
        color: var(--muted);
        font-family: ui-monospace, monospace;
        font-size: 0.76rem;
        border-top: 1px solid var(--border);
        margin: 4rem 0 0;
        padding: 1.2rem 0 0;
      }
      .colophon a {
        color: inherit;
      }
      section {
        margin-bottom: 3.5rem;
      }
      section h2 {
        font-size: 1.4rem;
        margin: 0 0 1rem;
        padding-bottom: 0.4rem;
        border-bottom: 1px solid var(--border);
      }
      section h3 {
        font-size: 1.05rem;
        margin: 2rem 0 0.6rem;
      }
      section p,
      section ul,
      section ol {
        max-width: var(--measure);
      }
      li {
        margin: 0.3rem 0;
      }
      /* Code blocks: white-space set here so a filled-in block cannot collapse. */
      pre,
      .code-block {
        white-space: pre-wrap;
        overflow-x: auto;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 0.9rem 1.1rem;
        font:
          0.86rem/1.55 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
        tab-size: 2;
      }
      pre .del {
        color: var(--bad);
      }
      pre .add {
        color: var(--ok);
      }
      pre .hi {
        background: var(--accent-soft);
        border-radius: 3px;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 0.9em;
        background: var(--surface);
        padding: 0.05rem 0.3rem;
        border-radius: 4px;
        overflow-wrap: anywhere;
      }
      /* A file:line reference linked to the code it names. Wraps a <code> span
         in prose, or the bare text of a .filename label. */
      a.srcref {
        color: inherit;
        text-decoration: none;
        border-bottom: 1px solid var(--muted);
      }
      a.srcref:hover {
        border-bottom-color: var(--accent);
      }
      a.srcref:hover code {
        background: var(--accent-soft);
      }
      /* Path label for the code block below it. */
      .filename {
        font-size: 0.78rem;
        color: var(--muted);
        font-family: ui-monospace, monospace;
        margin: 1.5rem 0 0.3rem;
        overflow-wrap: anywhere;
      }
      /* Comparison table: one row per case, .yes / .no / .warn on outcome cells. */
      table.vals {
        border-collapse: collapse;
        margin: 1.5rem 0;
        font-size: 0.86rem;
        width: 100%;
        max-width: 620px;
      }
      table.vals th,
      table.vals td {
        border: 1px solid var(--border-strong);
        padding: 0.4rem 0.65rem;
        text-align: left;
      }
      table.vals th {
        background: var(--surface);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
      }
      table.vals td.yes {
        background: var(--ok-soft);
      }
      table.vals td.no {
        background: var(--bad-soft);
      }
      table.vals td.warn {
        background: var(--edge-soft);
      }
      /* Callouts: .callout for a concept, .callout.edge for a caveat. */
      .callout {
        background: var(--accent-soft);
        border-left: 3px solid var(--accent);
        border-radius: 0 6px 6px 0;
        padding: 0.85rem 1.1rem;
        margin: 1.5rem 0;
        max-width: var(--measure);
      }
      .callout .label {
        display: block;
        font-size: 0.7rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
        margin-bottom: 0.3rem;
      }
      .callout.edge {
        background: var(--edge-soft);
        border-left-color: var(--edge);
      }
      .callout.edge .label {
        color: var(--edge);
      }
      /* Skippable deep-background block. */
      details.skippable {
        border: 1px solid var(--border-strong);
        border-radius: 8px;
        padding: 0.75rem 1.1rem;
        margin: 1.25rem 0;
      }
      details.skippable > summary {
        cursor: pointer;
        font-weight: 600;
        font-size: 0.92rem;
        color: var(--muted);
      }
      details.skippable[open] > summary {
        margin-bottom: 0.75rem;
      }
      /* Diagram family 1: simplified app UI mockup. */
      .ui-mockup {
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        overflow: hidden;
        margin: 1.5rem 0;
        max-width: 560px;
        font-size: 0.85rem;
      }
      .ui-mockup .bar {
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        padding: 0.5rem 0.85rem;
        font-weight: 600;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .ui-mockup .body {
        padding: 1.1rem 0.85rem;
        font-family: ui-monospace, monospace;
        font-size: 0.78rem;
        white-space: pre-wrap;
      }
      .mock-caption {
        font-size: 0.78rem;
        color: var(--muted);
        margin: 0.3rem 0 0;
        max-width: var(--measure);
      }
      /* Diagram family 2: data flow between components, example data on the arrows. */
      .dataflow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.5rem;
        margin: 1.5rem 0;
      }
      /* Each arrow travels with the node it points at. Without this, a flow
         wider than the column wraps between an arrow and its node, leaving the
         arrow pointing at nothing and the node stranded on the next line. */
      .dataflow .step {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .dataflow .node {
        background: var(--accent-soft);
        border: 1px solid var(--accent);
        color: var(--text);
        border-radius: 8px;
        padding: 0.6rem 0.9rem;
        font-size: 0.85rem;
        text-align: center;
        max-width: 175px;
      }
      .dataflow .node.terminal {
        background: var(--surface);
        border-color: var(--border);
      }
      .dataflow .node.pass {
        background: var(--ok-soft);
        border-color: var(--ok);
      }
      .dataflow .node.fail {
        background: var(--bad-soft);
        border-color: var(--bad);
      }
      .dataflow .arrow {
        display: flex;
        flex-direction: column;
        align-items: center;
        color: var(--muted);
        font-size: 0.72rem;
        min-width: 96px;
      }
      .dataflow .arrow .line {
        width: 100%;
        border-top: 2px solid var(--border);
        position: relative;
      }
      .dataflow .arrow .line::after {
        content: "\25B6";
        position: absolute;
        right: -2px;
        top: -0.72em;
        color: var(--border);
        font-size: 0.7rem;
      }
      .dataflow .arrow .data {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 5px;
        padding: 0.05rem 0.35rem;
        margin-bottom: 0.2rem;
        font-family: ui-monospace, monospace;
      }
      .flow-label {
        font-size: 0.8rem;
        color: var(--muted);
        font-weight: 600;
        margin: 1.25rem 0 0.25rem;
      }
      /* A numbered sequence with one marked position: call stacks, retry
         counts, any ranked list. Not one of the numbered families; reach for
         it when a step in an ordered list is the point. */
      .frames {
        list-style: none;
        padding: 0;
        margin: 1.25rem 0;
        max-width: 620px;
        font-family: ui-monospace, monospace;
        font-size: 0.82rem;
      }
      .frames li {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.45rem 0.7rem;
        margin: 0.3rem 0;
        background: var(--surface);
      }
      .frames li.target {
        background: var(--ok-soft);
        border-color: var(--ok);
      }
      .frames .n {
        display: inline-block;
        min-width: 2.2em;
        color: var(--muted);
      }
      /* Diagram family 3: node/recursion tree (ASTs, nesting, recursion) */
      .tree {
        margin: 1.5rem 0;
        font:
          0.82rem/1.5 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          monospace;
      }
      .tnode {
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.3rem 0.55rem;
        margin: 0.3rem 0;
        background: var(--surface);
        display: inline-block;
      }
      .tnode.leaf {
        background: var(--bg);
      }
      .tnode.kept {
        border-color: var(--ok);
        background: var(--ok-soft);
      }
      .tnode.skipped {
        border-color: var(--muted);
        color: var(--muted);
      }
      .tchildren {
        margin-left: 1.4rem;
        border-left: 2px dotted var(--border);
        padding-left: 0.9rem;
      }
      .tnote {
        color: var(--muted);
        font-size: 0.75rem;
        margin-left: 0.4rem;
      }

      /* Optional tabular body for .ui-mockup, when the mocked UI is a table. */
      .mock-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      .mock-table th,
      .mock-table td {
        border: 1px solid var(--border);
        padding: 0.35rem 0.5rem;
        text-align: left;
      }
      .mock-table th {
        background: var(--surface);
        font-weight: 600;
      }
      .mock-table .col-highlight {
        background: var(--accent-soft);
      }

      .mermaid {
        margin: 1.75rem 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem;
        overflow-x: auto;
        white-space: pre;
        font-family: ui-monospace, monospace;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .mermaid .edgeLabel,
      .mermaid .edgeLabel p,
      .mermaid .edgeLabel span,
      .mermaid .edgeLabel foreignObject div {
        background: var(--surface) !important;
        color: var(--text) !important;
      }
      /* Quiz */
      .quiz-question {
        border: 1px solid var(--border-strong);
        border-radius: 10px;
        padding: 1.1rem 1.25rem;
        margin: 1.5rem 0;
        max-width: var(--measure);
      }
      .quiz-question > p.q {
        font-weight: 600;
        margin: 0 0 0.85rem;
      }
      .quiz-option {
        display: block;
        width: 100%;
        text-align: left;
        background: var(--bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 0.6rem 0.8rem;
        margin-bottom: 0.5rem;
        font: inherit;
        font-size: 0.92rem;
        cursor: pointer;
      }
      .quiz-option:hover:not(:disabled) {
        border-color: var(--accent);
      }
      .quiz-option.correct {
        background: var(--ok-soft);
        border-color: var(--ok);
      }
      .quiz-option.incorrect {
        background: var(--bad-soft);
        border-color: var(--bad);
      }
      .quiz-option:disabled {
        cursor: default;
      }
      .quiz-feedback {
        display: none;
        font-size: 0.88rem;
        padding: 0.6rem 0.8rem;
        border-radius: 7px;
        margin-top: 0.3rem;
      }
      .quiz-feedback.show {
        display: block;
      }
      .quiz-feedback.ok {
        background: var(--ok-soft);
      }
      .quiz-feedback.bad {
        background: var(--edge-soft);
      }
      a:focus-visible,
      summary:focus-visible,
      .quiz-option:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
      table.vals td.yes::before,
      .dataflow .node.pass::before,
      .tnode.kept::before,
      .quiz-option.correct::before {
        content: "\2713\00a0";
        font-weight: 700;
      }
      table.vals td.no::before,
      .dataflow .node.fail::before,
      .quiz-option.incorrect::before {
        content: "\2717\00a0";
        font-weight: 700;
      }
      table.vals td.warn::before {
        content: "\25B2\00a0";
        font-weight: 700;
      }
      .tnode.skipped::before {
        content: "\2013\00a0";
        font-weight: 700;
      }
      @media (max-width: 800px) {
        .layout {
          grid-template-columns: minmax(0, 1fr);
          gap: 1rem;
          padding: 1.25rem 1.1rem 4rem;
        }
        nav.toc {
          position: static;
          border: 1px solid var(--border);
          border-radius: 8px;
          padding: 0.75rem 1rem;
        }
        body {
          font-size: 16px;
        }
        main > header h1 {
          font-size: 1.6rem;
        }
        table.vals {
          display: block;
          overflow-x: auto;
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <nav class="toc">
        <strong>Contents</strong>
        <ol>
          <li><a href="#background">Background</a></li>
          <li><a href="#intuition">Intuition</a></li>
          <li><a href="#code">Code walkthrough</a></li>
          <li><a href="#quiz">Quiz</a></li>
        </ol>
      </nav>

      <main>
        <header>
          <h1><!-- FILL: title --></h1>
          <p class="lead">
            <!-- FILL: one-sentence summary of what this change does -->
          </p>
          <p class="provenance">
            <!-- FILL: owner/repo PR 1234 at abc1234, explained YYYY-MM-DD.
                 Then either "References link to this commit." or the reason
                 they do not, as in "References are not linked: the host is
                 not GitHub." -->
          </p>
        </header>

        <section id="background">
          <h2>Background</h2>
          <details class="skippable">
            <summary>
              New to this area? Expand for the deeper background.
            </summary>
            <!-- FILL: beginner-level background on the existing system -->
          </details>
          <!-- FILL: narrow background, directly relevant to the change -->

          <div class="callout">
            <span class="label">Key concept</span>
            <!-- FILL: a definition or key concept the reader needs -->
          </div>

          <!-- Edge-case variant (amber): add the `edge` class for a gotcha, caveat,
               or warning. Step 4 calls for edge-case callouts; reuse this near the
               relevant point in Intuition or Code, not only in Background. -->
          <div class="callout edge">
            <span class="label">Edge case</span>
            <!-- FILL: an edge case, gotcha, or caveat worth flagging -->
          </div>
        </section>

        <section id="intuition">
          <h2>Intuition</h2>
          <!-- FILL: the core idea, with concrete toy-data examples -->

          <!-- Diagram family 1: simplified UI -->
          <div class="ui-mockup">
            <div class="bar"><!-- FILL: e.g. the screen or panel name --></div>
            <div class="body">
              <!-- FILL: simplified UI content; a .mock-table works well for tabular UI -->
            </div>
          </div>

          <!-- Diagram family 2: data flow with example data. Node variants: .terminal (endpoints), .pass (success), .fail (error).
               The first node stands alone; every node after it is wrapped with its
               incoming arrow in a .step, so a long flow wraps between steps. -->
          <p class="flow-label"><!-- FILL: optional label, e.g. Before --></p>
          <div class="dataflow">
            <div class="node terminal"><!-- FILL: source --></div>
            <div class="step">
              <div class="arrow">
                <span class="data"><!-- FILL: example payload --></span
                ><span class="line"></span>
              </div>
              <div class="node"><!-- FILL: component --></div>
            </div>
          </div>

          <!-- Diagram family 3: node/recursion tree. Mark nodes .kept (used) or .skipped (ignored); .leaf for leaves. -->
          <div class="tree">
            <div class="tnode"><!-- FILL: root node --></div>
            <div class="tchildren">
              <div class="tnode leaf kept">
                <!-- FILL: leaf value --><span class="tnote">note</span>
              </div>
            </div>
          </div>

          <!-- Diagram family 4: Mermaid, for a state machine, ER, or sequence (interaction
           over time). Validate the source with `npx -y @probelabs/maid@0.0.29 --strict <file.mmd>`
           before pasting. The loader at the end of <body> renders it; delete this block
           if the page has no Mermaid diagram. -->
          <pre
            class="mermaid"
          ><!-- FILL: mermaid source, e.g. sequenceDiagram or stateDiagram-v2 --></pre>
        </section>

        <section id="code">
          <h2>Code walkthrough</h2>
          <!-- FILL: one-line flow map, then the grouped, flow-ordered walkthrough -->
          <!-- The path label above a code block. Link it when the run resolved a
               host: the anchor goes outside the text, and the href ends #L<n> for
               a single line or #L<a>-L<b> for a range. Drop the <a> and keep the
               bare text when the reference is one the run could not link. -->
          <p class="filename">
            <a
              class="srcref"
              href="https://github.com/OWNER/REPO/blob/SHA/path/to/file.ext#L70-L77"
              ><!-- FILL: path/to/file.ext:70-77 --></a
            >
          </p>
          <!-- In <pre>, wrap removed lines in <span class="del"> and added lines in <span class="add"> for before/after diffs. -->
          <pre><!-- FILL: a representative code excerpt, using .del / .add spans for diff lines --></pre>

          <!-- A reference inside prose takes the same anchor around a <code> span:
               <a class="srcref" href="...#L88"><code>src/parser.rs:88</code></a> -->
        </section>

        <section id="quiz">
          <h2>Quiz</h2>
          <!-- Repeat this block five times. data-correct marks the right option. -->
          <div class="quiz-question">
            <p class="q"><!-- FILL: question 1 --></p>
            <button class="quiz-option"><!-- FILL: option --></button>
            <button class="quiz-option" data-correct>
              <!-- FILL: correct option -->
            </button>
            <button class="quiz-option"><!-- FILL: option --></button>
            <div class="quiz-feedback" role="status">
              <!-- FILL: why the correct answer is right -->
            </div>
          </div>
        </section>
      </main>

      <footer class="colophon">
        Generated with
        <a href="https://github.com/malav2110/explain-diff-html"
          >explain-diff-html</a
        >
      </footer>
    </div>

    <script>
      document.querySelectorAll(".quiz-question").forEach(function (question) {
        var feedback = question.querySelector(".quiz-feedback");

        // Shuffle the options on every load, so the correct answer's position is
        // random and a reader cannot fall into answering by position. Each option
        // is re-inserted before the feedback block, which has to stay last.
        var shuffled = Array.prototype.slice.call(
          question.querySelectorAll(".quiz-option"),
        );
        for (var i = shuffled.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var swap = shuffled[i];
          shuffled[i] = shuffled[j];
          shuffled[j] = swap;
        }
        shuffled.forEach(function (option) {
          question.insertBefore(option, feedback);
        });

        var options = question.querySelectorAll(".quiz-option");
        options.forEach(function (option) {
          option.addEventListener("click", function () {
            var isCorrect = option.hasAttribute("data-correct");
            options.forEach(function (other) {
              other.disabled = true;
              if (other.hasAttribute("data-correct"))
                other.classList.add("correct");
            });
            if (!isCorrect) option.classList.add("incorrect");
            feedback.classList.add("show", isCorrect ? "ok" : "bad");
            feedback.insertBefore(
              document.createTextNode(isCorrect ? "Correct. " : "Not quite. "),
              feedback.firstChild,
            );
          });
        });
      });
    </script>
    <script>
      // Mermaid loads without blocking: the page scripts above run first, and a slow
      // or blocked CDN never holds up the quiz or the rest of the page. This is the
      // only permitted external request, and it fires only when a .mermaid block is
      // present. Leave it in place; it is a no-op on pages without a diagram.
      (function () {
        var blocks = document.querySelectorAll(".mermaid");
        if (!blocks.length) return;

        // mermaid.run() replaces each block's text with an SVG, so the source is
        // gone after the first render. Stash it, because a theme change has to
        // parse it again.
        blocks.forEach(function (block) {
          block.dataset.source = block.textContent;
        });

        var darkQuery = window.matchMedia("(prefers-color-scheme: dark)");

        function render() {
          blocks.forEach(function (block) {
            block.removeAttribute("data-processed");
            block.textContent = block.dataset.source;
          });
          try {
            window.mermaid.initialize({
              startOnLoad: false,
              theme: darkQuery.matches ? "dark" : "default",
            });
          } catch (e) {}
          Promise.resolve(window.mermaid.run({ nodes: blocks })).catch(
            function () {},
          );
        }

        var s = document.createElement("script");
        s.src =
          "https://cdn.jsdelivr.net/npm/mermaid@11.16.0/dist/mermaid.min.js";
        s.integrity =
          "sha384-T/0lMUdJpd2S1ZHtRiofG3htU3xPCrFVeAQ1UUE2TJwlEJSV5NUwn30kP28n238E";
        s.crossOrigin = "anonymous";
        s.onload = function () {
          render();
          // Re-render when the reader switches system theme, so the diagram does
          // not stay light on a dark page.
          if (darkQuery.addEventListener)
            darkQuery.addEventListener("change", render);
        };
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
