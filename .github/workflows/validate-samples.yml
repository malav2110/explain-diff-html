name: Validate samples

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install the validator's dependencies
        run: npm ci --omit=dev --prefix skills/explain-diff-html/scripts

      - name: Run validate-output.ts on every sample page
        run: sh .github/scripts/validate-samples.sh
