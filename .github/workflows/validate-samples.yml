name: Validate samples

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run validate-output.sh on every sample page
        run: sh .github/scripts/validate-samples.sh
